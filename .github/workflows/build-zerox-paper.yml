name: Build ZEROX Paper 1.21.11 v4.3

on:
  push:
    branches: [main, zerox-paper-v4-3-density]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_COMMIT: c5eb0790f199da6c38d0a650e1e5cd5415b28185
  ZEROX_JAR: ZEROX-Paper-1.21.11-v4.3.jar

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure deterministic build identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "ZEROX Build Bot"
          git config --global user.email "build@zeroxhost.space"
          echo "ZEROX_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "ZEROX_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "ZEROX_BUILD_TIME=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Clone pinned Paper build 132 source
        run: |
          git clone --filter=blob:none https://github.com/PaperMC/Paper.git paper
          git -C paper checkout "$UPSTREAM_COMMIT"

      - name: Verify pinned Minecraft version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'mcVersion=1.21.11' paper/gradle.properties
          test "$(git -C paper rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Apply upstream Paper patches
        working-directory: paper
        run: ./gradlew applyPatches --stacktrace

      - name: Apply ZEROX source patches
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_zerox.py paper
          python3 tools/fix_1_21_11_mappings.py paper
          python3 tools/apply_plugin_parallelism.py paper
          python3 tools/finalize_v3_metadata.py paper
          python3 tools/apply_semantic_preserving.py paper
          python3 tools/apply_v4_1_migration.py paper
          python3 tools/apply_v4_2_join_load.py paper
          python3 tools/apply_v4_3_density.py paper

      - name: Validate generated v4.3 scheduler source
        shell: bash
        run: |
          set -euo pipefail
          ASYNC=paper/paper-server/src/main/java/org/bukkit/craftbukkit/scheduler/CraftAsyncScheduler.java
          grep -F 'ZeroxAdaptiveThreadPoolExecutor' "$ASYNC"
          grep -F 'ZeroxAsyncOverflowPolicy' "$ASYNC"
          ! grep -F 'CallerRunsPolicy' "$ASYNC"
          test -s paper/paper-server/src/main/java/io/papermc/paper/zerox/ZeroxMainThreadPressure.java
          test -s paper/paper-server/src/main/java/io/papermc/paper/zerox/ZeroxAdaptiveThreadPoolExecutor.java
          test -s paper/paper-server/src/main/java/io/papermc/paper/zerox/ZeroxAsyncOverflowPolicy.java

      - name: Capture exact generated source diffs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          git -C paper add -N \
            paper-server/src/main/java/io/papermc/paper/zerox \
            paper-server/src/main/java/org/bukkit/craftbukkit/scheduler/ZeroxSchedulerGuard.java \
            paper-server/src/main/resources/META-INF/zerox-build.json
          git -C paper diff -- \
            paper-api/src/main/java \
            paper-server/src/main/java \
            paper-server/src/main/resources > audit/zerox-paper-server.patch
          git -C paper/paper-server/src/minecraft diff > audit/zerox-minecraft.patch
          test -s audit/zerox-paper-server.patch
          test -s audit/zerox-minecraft.patch

      - name: Build Mojmap Paperclip jar
        working-directory: paper
        run: ./gradlew createMojmapPaperclipJar --stacktrace

      - name: Collect and package auditable artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          JAR="$(find paper/paper-server/build/libs -maxdepth 1 -type f -name 'paper-paperclip-*.jar' | head -n1)"
          test -n "$JAR"
          cp "$JAR" "out/$ZEROX_JAR"
          python3 tools/package_zerox_v4.py "out/$ZEROX_JAR" \
            --upstream-commit "$UPSTREAM_COMMIT" \
            --zerox-commit "$ZEROX_COMMIT" \
            --build-number "$ZEROX_BUILD_NUMBER" \
            --build-time "$ZEROX_BUILD_TIME"
          (cd out && sha256sum "$ZEROX_JAR" > "$ZEROX_JAR.sha256")
          cp PATCHES.md BUGFIXES.yml BENCHMARKS.md out/
          cp audit/zerox-paper-server.patch audit/zerox-minecraft.patch out/

      - name: Validate ZEROX identity and archive integrity
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "out/$ZEROX_JAR"
          unzip -p "out/$ZEROX_JAR" META-INF/zerox-build.json | tee out/zerox-build.json
          grep -F '"name": "ZEROX Paper"' out/zerox-build.json
          grep -F '"version": "2.3.0"' out/zerox-build.json
          grep -F '"highDensityProfile": true' out/zerox-build.json
          grep -F '"callerRunsPolicyRemoved": true' out/zerox-build.json
          grep -F '"asyncWorkRunsOnMainThreadWhenSaturated": false' out/zerox-build.json
          grep -F '"adaptiveAsyncConcurrency": true' out/zerox-build.json
          grep -F '"playerConcurrentChunkLoads": 3' out/zerox-build.json
          grep -F '"playerConcurrentChunkGenerates": 1' out/zerox-build.json
          grep -F '"workDropped": false' out/zerox-build.json
          grep -F '"fixedMsptGuarantee": false' out/zerox-build.json
          grep -F '"upstreamPaperBuild": 132' out/zerox-build.json
          unzip -l "out/$ZEROX_JAR" | grep -F 'META-INF/zerox/patches/0009-high-density-backpressure.patch'

      - name: Prepare v4.3 regression expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/ci_smoke_test.sh')
          text = path.read_text()
          text = text.replace('async=2-8 threads, queue=4096', 'async=2-8 threads, queue=16384')
          path.write_text(text)

          path = Path('tools/ci_v4_1_migration_test.sh')
          text = path.read_text()
          text = text.replace("grep -Eq 'ZEROX Paper 1\\.21\\.11-v4\\.[12]' server.log", "grep -q 'ZEROX Paper 1.21.11-v4.3' server.log")
          path.write_text(text)

          path = Path('tools/ci_v4_2_join_load_test.sh')
          text = path.read_text()
          text = text.replace('ZEROX Paper 1.21.11-v4.2', 'ZEROX Paper 1.21.11-v4.3')
          text = text.replace('player-max-chunk-send-rate:[[:space:]]*35.0', 'player-max-chunk-send-rate:[[:space:]]*24.0')
          text = text.replace('player-max-chunk-load-rate:[[:space:]]*50.0', 'player-max-chunk-load-rate:[[:space:]]*36.0')
          text = text.replace('player-max-chunk-generate-rate:[[:space:]]*12.0', 'player-max-chunk-generate-rate:[[:space:]]*8.0')
          text = text.replace('player-max-concurrent-chunk-loads:[[:space:]]*4', 'player-max-concurrent-chunk-loads:[[:space:]]*3')
          text = text.replace('player-max-concurrent-chunk-generates:[[:space:]]*2', 'player-max-concurrent-chunk-generates:[[:space:]]*1')
          text = text.replace('test -f .zerox/backups/config_paper-global.yml.pre-v4.2.bak', 'test -f .zerox/backups/config_paper-global.yml.pre-v4.2.bak\ntest -f .zerox/backups/config_paper-global.yml.pre-v4.3.bak\ngrep -Eq \'^migration\\.v4-3-density=true$\' .zerox/zerox.properties')
          path.write_text(text)
          PY

      - name: Startup and semantic-preservation regression test
        shell: bash
        env:
          P_SERVER_UUID: ci
          SERVER_PORT: '25565'
        run: bash tools/ci_smoke_test.sh "out/$ZEROX_JAR"

      - name: Legacy configuration migration and TNT completion test
        shell: bash
        env:
          P_SERVER_UUID: ci-migration
          SERVER_PORT: '25566'
        run: bash tools/ci_v4_1_migration_test.sh "out/$ZEROX_JAR"

      - name: Join-load and density migration regression test
        shell: bash
        env:
          P_SERVER_UUID: ci-join-load
          SERVER_PORT: '25567'
        run: bash tools/ci_v4_2_join_load_test.sh "out/$ZEROX_JAR"

      - name: Upload ZEROX Paper v4.3
        uses: actions/upload-artifact@v4
        with:
          name: ZEROX-Paper-1.21.11-v4.3
          path: out/*
          if-no-files-found: error
          retention-days: 30
