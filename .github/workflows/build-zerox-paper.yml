name: Build ZEROX Paper 1.21.11 v2

on:
  push:
    branches: [main, zerox-paper-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_COMMIT: c5eb0790f199da6c38d0a650e1e5cd5415b28185
  ZEROX_JAR: ZEROX-Paper-1.21.11-v2.jar

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure deterministic build identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "ZEROX Build Bot"
          git config --global user.email "build@zeroxhost.space"
          echo "ZEROX_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "ZEROX_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "ZEROX_BUILD_TIME=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Clone pinned Paper build 132 source
        run: |
          git clone --filter=blob:none https://github.com/PaperMC/Paper.git paper
          git -C paper checkout "$UPSTREAM_COMMIT"

      - name: Verify pinned Minecraft version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'mcVersion=1.21.11' paper/gradle.properties
          test "$(git -C paper rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Apply upstream Paper patches
        working-directory: paper
        run: ./gradlew applyPatches --stacktrace

      - name: Apply ZEROX source patches
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_zerox.py paper
          python3 tools/fix_1_21_11_mappings.py paper

      - name: Capture exact generated source diffs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          git -C paper add -N \
            paper-server/src/main/java/io/papermc/paper/zerox \
            paper-server/src/main/resources/META-INF/zerox-build.json
          git -C paper diff -- paper-server/src/main/java paper-server/src/main/resources > audit/zerox-paper-server.patch
          git -C paper/paper-server/src/minecraft diff > audit/zerox-minecraft.patch
          test -s audit/zerox-paper-server.patch
          test -s audit/zerox-minecraft.patch

      - name: Build Mojmap Paperclip jar
        working-directory: paper
        run: ./gradlew createMojmapPaperclipJar --stacktrace

      - name: Collect and package auditable artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          JAR="$(find paper/paper-server/build/libs -maxdepth 1 -type f -name 'paper-paperclip-*.jar' | head -n1)"
          test -n "$JAR"
          cp "$JAR" "out/$ZEROX_JAR"
          python3 tools/package_zerox.py "out/$ZEROX_JAR" \
            --upstream-commit "$UPSTREAM_COMMIT" \
            --zerox-commit "$ZEROX_COMMIT" \
            --build-number "$ZEROX_BUILD_NUMBER" \
            --build-time "$ZEROX_BUILD_TIME"
          (cd out && sha256sum "$ZEROX_JAR" > "$ZEROX_JAR.sha256")
          cp PATCHES.md BUGFIXES.yml BENCHMARKS.md out/
          cp audit/zerox-paper-server.patch audit/zerox-minecraft.patch out/

      - name: Validate ZEROX identity and archive integrity
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "out/$ZEROX_JAR"
          unzip -p "out/$ZEROX_JAR" META-INF/zerox-build.json | tee out/zerox-build.json
          grep -F '"name": "ZEROX Paper"' out/zerox-build.json
          grep -F '"upstreamPaperBuild": 132' out/zerox-build.json
          unzip -l "out/$ZEROX_JAR" | grep -F 'META-INF/zerox/patches/0003-adaptive-tnt-explosion-budget.patch'

      - name: Startup and TNT load smoke test
        shell: bash
        env:
          P_SERVER_UUID: ci
          SERVER_PORT: '25565'
        run: |
          set -euo pipefail
          mkdir -p smoke/.zerox
          cp "out/$ZEROX_JAR" smoke/server.jar
          printf 'eula=true\n' > smoke/eula.txt
          printf 'server-port=25565\nonline-mode=false\nview-distance=2\nsimulation-distance=2\nspawn-protection=0\n' > smoke/server.properties
          cat > smoke/.zerox/zerox.properties <<'EOF'
          worker-threads=auto
          tnt.max-explosions-per-tick=8
          tnt.max-processing-ms-per-tick=5
          tnt.log-deferrals=true
          EOF
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('smoke').resolve()
          key_hash = 'f584e637e37772eaa684ad6dcfa49858206c02ab68217c69579204600239660b'
          fingerprint = hashlib.sha256(f'ci|25565|{root}'.encode()).hexdigest()
          token = hashlib.sha256(f'{fingerprint}|{key_hash}|ZEROX-PAPER-1.21.11'.encode()).hexdigest()
          Path('smoke/.zerox/activation.properties').write_text(
              '# ZEROX CI activation\nformat=1\n'
              f'fingerprint={fingerprint}\ntoken={token}\nactivatedAt=ci\n'
          )
          PY
          cd smoke
          mkfifo console
          exec 3<>console
          java -Xms1G -Xmx1G -jar server.jar --nogui <console >server.log 2>&1 &
          PID=$!
          READY=0
          for _ in $(seq 1 240); do
            if grep -q 'Done (' server.log && grep -q '\[ZEROX\] Ready in ' server.log; then READY=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then cat server.log; wait "$PID" || true; exit 1; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat server.log; kill "$PID" 2>/dev/null || true; exit 1; fi

          echo version >&3
          sleep 2
          grep -q 'ZEROX Paper 1.21.11-v2' server.log
          echo 'fill 0 80 0 15 83 15 minecraft:tnt' >&3
          echo 'setblock -1 80 0 minecraft:redstone_block' >&3

          GUARDED=0
          for _ in $(seq 1 90); do
            if grep -q 'TNT load guard deferred' server.log; then GUARDED=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then cat server.log; wait "$PID" || true; exit 1; fi
            sleep 1
          done
          if [ "$GUARDED" -ne 1 ]; then
            cat server.log
            echo 'TNT guard did not activate' >&2
            kill "$PID" 2>/dev/null || true
            exit 1
          fi

          sleep 15
          kill -0 "$PID"
          echo tps >&3
          sleep 3
          echo stop >&3
          for _ in $(seq 1 45); do
            if ! kill -0 "$PID" 2>/dev/null; then
              wait "$PID" || true
              cp server.log ../out/ci-server.log
              grep '\[ZEROX\] Ready in ' server.log > ../out/ci-startup.txt
              grep 'TNT load guard deferred' server.log > ../out/ci-tnt-guard.txt
              exit 0
            fi
            sleep 1
          done
          cat server.log
          kill "$PID" 2>/dev/null || true
          wait "$PID" || true
          exit 1

      - name: Upload ZEROX Paper v2
        uses: actions/upload-artifact@v4
        with:
          name: ZEROX-Paper-1.21.11-v2
          path: out/*
          if-no-files-found: error
          retention-days: 30
