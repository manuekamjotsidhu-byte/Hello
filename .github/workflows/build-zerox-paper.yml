name: Build ZEROX Paper 1.21.11 v3

on:
  push:
    branches: [main, zerox-paper-v3-plugin-parallelism]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_COMMIT: c5eb0790f199da6c38d0a650e1e5cd5415b28185
  ZEROX_JAR: ZEROX-Paper-1.21.11-v3.jar

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure deterministic build identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "ZEROX Build Bot"
          git config --global user.email "build@zeroxhost.space"
          echo "ZEROX_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "ZEROX_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "ZEROX_BUILD_TIME=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Clone pinned Paper build 132 source
        run: |
          git clone --filter=blob:none https://github.com/PaperMC/Paper.git paper
          git -C paper checkout "$UPSTREAM_COMMIT"

      - name: Verify pinned Minecraft version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'mcVersion=1.21.11' paper/gradle.properties
          test "$(git -C paper rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Apply upstream Paper patches
        working-directory: paper
        run: ./gradlew applyPatches --stacktrace

      - name: Apply ZEROX source patches
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_zerox.py paper
          python3 tools/fix_1_21_11_mappings.py paper
          python3 tools/apply_plugin_parallelism.py paper
          python3 tools/finalize_v3_metadata.py paper

      - name: Capture exact generated source diffs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          git -C paper add -N \
            paper-server/src/main/java/io/papermc/paper/zerox \
            paper-server/src/main/java/org/bukkit/craftbukkit/scheduler/ZeroxSchedulerGuard.java \
            paper-server/src/main/resources/META-INF/zerox-build.json
          git -C paper diff -- paper-server/src/main/java paper-server/src/main/resources > audit/zerox-paper-server.patch
          git -C paper/paper-server/src/minecraft diff > audit/zerox-minecraft.patch
          test -s audit/zerox-paper-server.patch
          test -s audit/zerox-minecraft.patch

      - name: Build Mojmap Paperclip jar
        working-directory: paper
        run: ./gradlew createMojmapPaperclipJar --stacktrace

      - name: Collect and package auditable artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          JAR="$(find paper/paper-server/build/libs -maxdepth 1 -type f -name 'paper-paperclip-*.jar' | head -n1)"
          test -n "$JAR"
          cp "$JAR" "out/$ZEROX_JAR"
          python3 tools/package_zerox_v3.py "out/$ZEROX_JAR" \
            --upstream-commit "$UPSTREAM_COMMIT" \
            --zerox-commit "$ZEROX_COMMIT" \
            --build-number "$ZEROX_BUILD_NUMBER" \
            --build-time "$ZEROX_BUILD_TIME"
          (cd out && sha256sum "$ZEROX_JAR" > "$ZEROX_JAR.sha256")
          cp PATCHES.md BUGFIXES.yml BENCHMARKS.md out/
          cp audit/zerox-paper-server.patch audit/zerox-minecraft.patch out/

      - name: Validate ZEROX identity and archive integrity
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "out/$ZEROX_JAR"
          unzip -p "out/$ZEROX_JAR" META-INF/zerox-build.json | tee out/zerox-build.json
          grep -F '"name": "ZEROX Paper"' out/zerox-build.json
          grep -F '"version": "2.1.0"' out/zerox-build.json
          grep -F '"pluginAsyncParallelism": "bounded"' out/zerox-build.json
          grep -F '"upstreamPaperBuild": 132' out/zerox-build.json
          unzip -l "out/$ZEROX_JAR" | grep -F 'META-INF/zerox/patches/0005-plugin-parallelism-load-guard.patch'

      - name: Startup, scheduler profile and loaded-chunk TNT test
        shell: bash
        env:
          P_SERVER_UUID: ci
          SERVER_PORT: '25565'
        run: bash tools/ci_smoke_test.sh "out/$ZEROX_JAR"

      - name: Upload ZEROX Paper v3
        uses: actions/upload-artifact@v4
        with:
          name: ZEROX-Paper-1.21.11-v3
          path: out/*
          if-no-files-found: error
          retention-days: 30
