name: Build ZEROX Paper 1.21.11
on:
  push:
    branches: [zerox-paper-1.21.11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clone pinned Paper
        run: git clone https://github.com/PaperMC/Paper.git paper && cd paper && git checkout 6da8af7ca4e29f4ea6961905a96d9f244980c932
      - name: Apply Paper patches
        working-directory: paper
        run: ./gradlew applyPatches --stacktrace
      - name: Apply ZEROX source patches
        run: python3 tools/apply_zerox.py paper
      - name: Build Paperclip jar
        working-directory: paper
        run: ./gradlew createPaperclipJar --stacktrace
      - name: Collect artifacts
        run: |
          mkdir -p out
          cp paper/paper-server/build/libs/paper-paperclip-*.jar out/ZEROX-Paper-1.21.11.jar
          sha256sum out/ZEROX-Paper-1.21.11.jar > out/ZEROX-Paper-1.21.11.jar.sha256
          cp PATCHES.md out/PATCHES.md
      - uses: actions/upload-artifact@v4
        with:
          name: ZEROX-Paper-1.21.11
          path: out/*
          if-no-files-found: error
