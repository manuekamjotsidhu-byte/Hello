name: Build ZEROX Paper 1.21.11

on:
  push:
    branches:
      - main
      - zerox-paper-1.21.11
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Git identity
        run: |
          git config --global user.name "ZEROX Build Bot"
          git config --global user.email "build@zeroxhost.space"
      - name: Clone pinned Paper
        run: git clone --filter=blob:none https://github.com/PaperMC/Paper.git paper && cd paper && git checkout 6da8af7ca4e29f4ea6961905a96d9f244980c932
      - name: Apply Paper patches
        working-directory: paper
        run: ./gradlew applyPatches --stacktrace
      - name: Apply ZEROX source patches
        run: python3 tools/apply_zerox.py paper
      - name: Build Mojmap Paperclip jar
        working-directory: paper
        run: ./gradlew createMojmapPaperclipJar --stacktrace
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          JAR="$(find paper/paper-server/build/libs -maxdepth 1 -type f -name 'paper-paperclip-*.jar' | head -n1)"
          test -n "$JAR"
          cp "$JAR" out/ZEROX-Paper-1.21.11.jar
          (cd out && sha256sum ZEROX-Paper-1.21.11.jar > ZEROX-Paper-1.21.11.jar.sha256)
          cp PATCHES.md out/PATCHES.md
      - name: Upload ZEROX Paper
        uses: actions/upload-artifact@v4
        with:
          name: ZEROX-Paper-1.21.11
          path: out/*
          if-no-files-found: error
          retention-days: 30
