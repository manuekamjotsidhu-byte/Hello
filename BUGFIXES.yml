schema: 1
project: ZEROX Paper
version: 2.2.2
minecraft: 1.21.11
upstream:
  project: PaperMC/Paper
  paper_build: 132
  commit: c5eb0790f199da6c38d0a650e1e5cd5415b28185

paper_issue_fixes: []

performance_changes:
  - id: ZPX-PERF-001
    name: Optimized explosion calculation
    patch: patches/server/0002-safe-performance-defaults.patch
    behavior_preserved: true

  - id: ZPX-PERF-005
    name: Bounded async plugin parallelism and sync-task telemetry
    patch: patches/server/0005-plugin-parallelism-load-guard.patch
    behavior_preserved: true

  - id: ZPX-PERF-006
    name: Semantic-preserving production defaults
    patch: patches/server/0006-semantic-preserving-defaults.patch
    defaults:
      preserve_semantics: true
      defer_repeating_tasks: false
      tnt_load_shedding: false
      max_tnt_per_tick: 100

  - id: ZPX-FIX-007
    name: Restore legacy persistent TNT and world values
    patch: patches/server/0007-restore-legacy-tnt-and-world-settings.patch
    migration:
      spigot_max_tnt_per_tick:
        from: [16, 32]
        to: 100
      armor_stand_collision_lookups:
        from: false
        to: true
      update_pathfinding_on_block_update:
        from: false
        to: true
      backups: .zerox/backups
      marker: migration.v4-1-gameplay-restored

  - id: ZPX-PERF-008
    name: Progressive player join and chunk-load smoothing
    patch: patches/server/0008-progressive-player-join-load.patch
    defaults:
      progressive_view_distance: true
      initial_send_distance: 3
      ramp_interval_ticks: 8
      start_grace_ticks: 10
      max_ramp_steps_per_tick: 1
      player_chunk_send_rate: 35.0
      player_chunk_load_rate: 50.0
      player_chunk_generate_rate: 12.0
      player_max_concurrent_chunk_loads: 4
      player_max_concurrent_chunk_generates: 2
      max_joins_per_tick: 1
      slow_event_warning_ms: 15
    behavior:
      - PlayerJoinEvent and plugin world access remain synchronous and authoritative.
      - Initial chunk expansion is queued and completed rather than dropped.
      - Eligible chunk loading, generation and I/O use Paper worker threads.
      - Explicit plugin changes to per-player send distance are respected.
      - Slow synchronous listeners are attributed to plugin, event and listener class.
    migration:
      file: config/paper-global.yml
      exact_upstream_defaults_only: true
      backup: .zerox/backups/config_paper-global.yml.pre-v4.2.bak
      marker: migration.v4-2-join-load

claims:
  all_paper_bugs_patched: false
  guaranteed_sub_10_mspt: false
  full_multicore_world_ticking: false
  bounded_async_plugin_parallelism: true
  progressive_join_load: true
  join_work_dropped: false
  arbitrary_sync_plugin_events_parallelized: false
  slow_sync_event_attribution: true
  gameplay_semantics_preserved_default: true
  paper_plugin_loading: true

notes:
  - Arbitrary synchronous Bukkit handlers cannot safely be moved to workers.
  - v4.2 spreads only known join/chunk work that Paper already supports asynchronously.
  - Custom non-default administrator values are preserved.
  - Every migrated YAML file is backed up before replacement.
