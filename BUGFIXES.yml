      update_pathfinding_on_block_update:
        from: false
        to: true
      backups: .zerox/backups
      marker: migration.v4-1-gameplay-restored
    regression_test:
      - legacy YAML is migrated before Paper configuration loading
      - original files are backed up
      - TNT load shedding remains disabled
      - a 64-block TNT chain primes and completes
      - no ZEROX TNT deferral is emitted

