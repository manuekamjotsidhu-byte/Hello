schema: 1
project: ZEROX Paper
version: 2.3.0
minecraft: 1.21.11
upstream:
  project: PaperMC/Paper
  paper_build: 132
  commit: c5eb0790f199da6c38d0a650e1e5cd5415b28185

paper_issue_fixes: []

performance_changes:
  - id: ZPX-PERF-001
    name: Optimized explosion calculation
    patch: patches/server/0002-safe-performance-defaults.patch

  - id: ZPX-PERF-005
    name: Bounded asynchronous plugin executor
    patch: patches/server/0005-plugin-parallelism-load-guard.patch

  - id: ZPX-PERF-006
    name: Semantic-preserving defaults
    patch: patches/server/0006-semantic-preserving-defaults.patch
    defaults:
      preserve_semantics: true
      defer_repeating_tasks: false
      tnt_load_shedding: false

  - id: ZPX-FIX-007
    name: Legacy gameplay-setting restoration
    patch: patches/server/0007-restore-legacy-tnt-and-world-settings.patch

  - id: ZPX-PERF-008
    name: Progressive player join loading
    patch: patches/server/0008-progressive-player-join-load.patch

  - id: ZPX-PERF-009
    name: High-density backpressure
    patch: patches/server/0009-high-density-backpressure.patch
    defaults:
      target_mspt: 20
      reserve_main_cores: 2
      async_overflow_queue: 16384
      player_chunk_send_rate: 24.0
      player_chunk_load_rate: 36.0
      player_chunk_generate_rate: 8.0
      player_max_concurrent_chunk_loads: 3
      player_max_concurrent_chunk_generates: 1
      max_joins_per_tick: 1
    migration:
      file: config/paper-global.yml
      backup: .zerox/backups/config_paper-global.yml.pre-v4.3.bak
      marker: migration.v4-3-density

claims:
  all_paper_bugs_patched: false
  guaranteed_sub_20_mspt_at_300_players: false
  full_multicore_world_ticking: false
  adaptive_async_concurrency: true
  caller_runs_policy_removed: true
  queued_work_dropped: false
  gameplay_semantics_preserved_default: true
  paper_plugin_loading: true

notes:
  - The 200-300 player target requires testing with the production plugin set and world.
  - Synchronous Bukkit operations retain their normal execution model.
  - Custom administrator values are preserved unless they match an earlier ZEROX default exactly.
